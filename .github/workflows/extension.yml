name: Package Chrome extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Test and package
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: startpage-extension
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
